<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="습관트래커">
<meta name="theme-color" content="#f5f3ee">
<title>매일 루틴 트래커</title>
<style>
  :root {
    --bg: #f5f3ee;
    --card: #ffffff;
    --text: #2b2b2b;
    --sub: #8a8a8a;
    --accent: #4a7c59;
    --accent-soft: #e4efe6;
    --border: #ececec;
    --danger: #c96a4f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    height: 100%;
  }
  body {
    display: flex;
    justify-content: center;
    padding: env(safe-area-inset-top, 24px) 16px calc(env(safe-area-inset-bottom, 24px) + 24px);
  }
  .app { width: 100%; max-width: 480px; }
  header { text-align: center; margin: 12px 0 20px; }
  header .date { font-size: 15px; color: var(--sub); margin-bottom: 4px; }
  .titlerow { display: flex; align-items: center; justify-content: center; position: relative; }
  header h1 { font-size: 22px; margin: 0; }
  .manage-btn {
    position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    background: none; border: 1px solid var(--border); border-radius: 20px;
    padding: 6px 12px; font-size: 13px; color: var(--sub);
  }
  .summary {
    background: var(--accent-soft);
    border-radius: 16px;
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }
  .summary .pct { font-size: 26px; font-weight: 700; color: var(--accent); }
  .summary .label { font-size: 13px; color: var(--sub); }
  .habit {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
    transition: transform .08s ease;
  }
  .habit:active { transform: scale(0.98); }
  .habit.done { border-color: var(--accent); background: var(--accent-soft); }
  .habit .icon { font-size: 24px; width: 32px; text-align: center; }
  .habit .info { flex: 1; }
  .habit .info .name { font-size: 16px; font-weight: 600; }
  .habit .info .streak { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .habit .check {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid #d8d8d8;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    color: transparent;
    flex-shrink: 0;
  }
  .habit.done .check {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .weeklytag {
    display: inline-block;
    font-size: 11px;
    color: var(--accent);
    background: #fff;
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 1px 6px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .empty-hint {
    text-align: center;
    color: var(--sub);
    font-size: 14px;
    padding: 24px 0;
  }
  .history {
    margin-top: 24px;
  }
  .history h2 {
    font-size: 14px;
    color: var(--sub);
    font-weight: 600;
    margin: 0 0 8px 4px;
  }
  .history-row {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
  }
  .history-row .h-name {
    width: 90px;
    font-size: 12px;
    color: var(--sub);
    display: flex;
    align-items: center;
  }
  .dots { display: flex; gap: 4px; flex: 1; }
  .dot {
    flex: 1;
    aspect-ratio: 1;
    border-radius: 4px;
    background: #e9e9e9;
  }
  .dot.on { background: var(--accent); }
  .manage {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 18px;
  }
  .manage.hidden { display: none; }
  .manage h2 { font-size: 15px; margin: 0 0 12px; }
  .manage-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .manage-row:last-child { border-bottom: none; }
  .manage-row .m-icon { width: 28px; text-align: center; font-size: 18px; }
  .manage-row .m-name { flex: 1; font-size: 14px; }
  .manage-row button {
    border: none; background: none; font-size: 16px; padding: 4px 6px; cursor: pointer;
  }
  .manage-row .save-btn, .manage-row .cancel-btn {
    font-size: 13px; border-radius: 8px; padding: 6px 10px;
  }
  .manage-row .save-btn { background: var(--accent); color: white; }
  .manage-row .cancel-btn { background: var(--border); color: var(--text); }
  .manage-row input[type="text"], .manage-row select {
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; font-size: 14px;
  }
  .manage-row .edit-icon { width: 44px; text-align: center; }
  .manage-row .edit-label { flex: 1; min-width: 0; }
  .manage-add {
    display: flex;
    gap: 6px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .manage-add input[type="text"] {
    border: 1px solid var(--border); border-radius: 8px; padding: 8px; font-size: 14px;
  }
  .manage-add select {
    border: 1px solid var(--border); border-radius: 8px; padding: 8px; font-size: 14px;
  }
  #newIcon { width: 48px; text-align: center; }
  #newLabel { flex: 1; min-width: 100px; }
  .manage-add button {
    background: var(--accent); color: white; border: none; border-radius: 8px;
    padding: 8px 14px; font-size: 14px;
  }
  footer {
    text-align: center;
    color: var(--sub);
    font-size: 11px;
    margin-top: 28px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="date" id="todayLabel"></div>
    <div class="titlerow">
      <h1>오늘의 루틴</h1>
      <button class="manage-btn" id="manageToggle">⚙️ 관리</button>
    </div>
  </header>

  <div class="summary">
    <div>
      <div class="label">오늘 완료</div>
      <div class="pct" id="todayPct">0%</div>
    </div>
    <div>
      <div class="label" style="text-align:right">이번 주 완료</div>
      <div class="pct" id="weekPct" style="text-align:right">0%</div>
    </div>
  </div>

  <div id="managePanel" class="manage hidden">
    <h2>루틴 관리</h2>
    <div id="manageList"></div>
    <div class="manage-add">
      <input id="newIcon" type="text" placeholder="🙂" maxlength="4">
      <input id="newLabel" type="text" placeholder="루틴 이름">
      <select id="newFreq">
        <option value="daily">매일</option>
        <option value="weekly">매주</option>
      </select>
      <button id="addHabitBtn">추가</button>
    </div>
  </div>

  <div id="habitList"></div>

  <div class="history">
    <h2>최근 14일</h2>
    <div id="historyGrid"></div>
  </div>

  <footer>탭해서 체크 · ⚙ 관리에서 루틴 추가/수정/삭제 · 데이터는 이 기기에만 저장됩니다</footer>
</div>

<script>
const DEFAULT_HABITS = [
  { id: 'pullup',  label: '턱걸이 1분',      icon: '💪', freq: 'daily' },
  { id: 'water',   label: '물 500ml',       icon: '💧', freq: 'daily' },
  { id: 'english', label: '영어대화 10분',   icon: '🗣️', freq: 'daily' },
  { id: 'vitamin', label: '영양제',          icon: '💊', freq: 'daily' },
  { id: 'reading', label: '책 5P 읽기',      icon: '📖', freq: 'daily' },
  { id: 'writing', label: '글쓰기',          icon: '✍️', freq: 'weekly' },
];

const STORE_KEY = 'habitTrackerData_v1';
const HABITS_KEY = 'habitTrackerHabitList_v1';

function loadData() {
  try {
    return JSON.parse(localStorage.getItem(STORE_KEY)) || { daily: {}, weekly: {} };
  } catch (e) {
    return { daily: {}, weekly: {} };
  }
}
function saveData(data) {
  localStorage.setItem(STORE_KEY, JSON.stringify(data));
}

function loadHabits() {
  try {
    const saved = JSON.parse(localStorage.getItem(HABITS_KEY));
    if (Array.isArray(saved)) return saved;
  } catch (e) {}
  saveHabits(DEFAULT_HABITS);
  return DEFAULT_HABITS.slice();
}
function saveHabits(list) {
  localStorage.setItem(HABITS_KEY, JSON.stringify(list));
}
function makeId() {
  return 'h' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function pad(n) { return n < 10 ? '0' + n : '' + n; }
function dateKey(d) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
// ISO week key, e.g. 2026-W28
function weekKey(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (date.getUTCDay() + 6) % 7;
  date.setUTCDate(date.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(date.getUTCFullYear(), 0, 4));
  const week = 1 + Math.round(((date - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay() + 6) % 7)) / 7);
  return `${date.getUTCFullYear()}-W${pad(week)}`;
}

let data = loadData();
let habits = loadHabits();
let editingId = null;
const today = new Date();
const todayKey = dateKey(today);
const thisWeekKey = weekKey(today);

function isDone(habit) {
  if (habit.freq === 'daily') {
    return !!(data.daily[todayKey] && data.daily[todayKey][habit.id]);
  }
  return !!data.weekly[thisWeekKey + '_' + habit.id];
}

function toggle(habit) {
  if (habit.freq === 'daily') {
    if (!data.daily[todayKey]) data.daily[todayKey] = {};
    data.daily[todayKey][habit.id] = !data.daily[todayKey][habit.id];
  } else {
    const k = thisWeekKey + '_' + habit.id;
    data.weekly[k] = !data.weekly[k];
  }
  saveData(data);
  render();
}

function dailyStreak(habit) {
  let streak = 0;
  let d = new Date(today);
  // if today not yet done, start counting from yesterday
  if (!isDone(habit)) d.setDate(d.getDate() - 1);
  while (true) {
    const k = dateKey(d);
    if (data.daily[k] && data.daily[k][habit.id]) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else break;
  }
  return streak;
}

function weeklyStreak(habit) {
  let streak = 0;
  let d = new Date(today);
  if (!isDone(habit)) d.setDate(d.getDate() - 7);
  while (true) {
    const k = weekKey(d) + '_' + habit.id;
    if (data.weekly[k]) {
      streak++;
      d.setDate(d.getDate() - 7);
    } else break;
  }
  return streak;
}

function render() {
  document.getElementById('todayLabel').textContent =
    today.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' });

  const list = document.getElementById('habitList');
  list.innerHTML = '';
  let doneCount = 0;

  if (habits.length === 0) {
    const hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.textContent = '⚙ 관리에서 루틴을 추가해보세요';
    list.appendChild(hint);
  }

  habits.forEach(habit => {
    const done = isDone(habit);
    if (done) doneCount++;
    const streak = habit.freq === 'daily' ? dailyStreak(habit) : weeklyStreak(habit);
    const streakLabel = habit.freq === 'daily'
      ? (streak > 0 ? `🔥 ${streak}일 연속` : '오늘부터 시작해봐요')
      : (streak > 0 ? `🔥 ${streak}주 연속` : '이번 주부터 시작해봐요');

    const row = document.createElement('div');
    row.className = 'habit' + (done ? ' done' : '');
    row.innerHTML = `
      <div class="icon">${habit.icon}</div>
      <div class="info">
        <div class="name">${habit.label}${habit.freq === 'weekly' ? '<span class="weeklytag">주 1회</span>' : ''}</div>
        <div class="streak">${streakLabel}</div>
      </div>
      <div class="check">✓</div>
    `;
    row.addEventListener('click', () => toggle(habit));
    list.appendChild(row);
  });

  document.getElementById('todayPct').textContent =
    habits.length ? Math.round((doneCount / habits.length) * 100) + '%' : '0%';

  // week percent: average completion across last 7 days for daily habits + this week's weekly habit
  const dailyHabits = habits.filter(h => h.freq === 'daily');
  let weekTotal = 0, weekDone = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const k = dateKey(d);
    dailyHabits.forEach(h => {
      weekTotal++;
      if (data.daily[k] && data.daily[k][h.id]) weekDone++;
    });
  }
  habits.filter(h => h.freq === 'weekly').forEach(h => {
    weekTotal++;
    if (isDone(h)) weekDone++;
  });
  document.getElementById('weekPct').textContent = weekTotal ? Math.round((weekDone / weekTotal) * 100) + '%' : '0%';

  renderHistory();
}

function renderHistory() {
  const grid = document.getElementById('historyGrid');
  grid.innerHTML = '';
  habits.forEach(habit => {
    const row = document.createElement('div');
    row.className = 'history-row';
    const name = document.createElement('div');
    name.className = 'h-name';
    name.textContent = habit.icon + ' ' + habit.label;
    row.appendChild(name);
    const dots = document.createElement('div');
    dots.className = 'dots';
    for (let i = 13; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      const dot = document.createElement('div');
      let on;
      if (habit.freq === 'daily') {
        const k = dateKey(d);
        on = !!(data.daily[k] && data.daily[k][habit.id]);
      } else {
        on = !!data.weekly[weekKey(d) + '_' + habit.id];
      }
      dot.className = 'dot' + (on ? ' on' : '');
      dots.appendChild(dot);
    }
    row.appendChild(dots);
    grid.appendChild(row);
  });
}

function toggleManagePanel() {
  const panel = document.getElementById('managePanel');
  panel.classList.toggle('hidden');
  if (!panel.classList.contains('hidden')) renderManage();
}

function renderManage() {
  const list = document.getElementById('manageList');
  list.innerHTML = '';

  habits.forEach(h => {
    const row = document.createElement('div');
    row.className = 'manage-row';

    if (editingId === h.id) {
      row.innerHTML = `
        <input type="text" class="edit-icon" value="${h.icon}" maxlength="4">
        <input type="text" class="edit-label" value="${h.label}">
        <select class="edit-freq">
          <option value="daily" ${h.freq === 'daily' ? 'selected' : ''}>매일</option>
          <option value="weekly" ${h.freq === 'weekly' ? 'selected' : ''}>매주</option>
        </select>
      `;
      const saveBtn = document.createElement('button');
      saveBtn.className = 'save-btn';
      saveBtn.textContent = '저장';
      saveBtn.addEventListener('click', () => {
        const icon = row.querySelector('.edit-icon').value.trim() || h.icon;
        const label = row.querySelector('.edit-label').value.trim() || h.label;
        const freq = row.querySelector('.edit-freq').value;
        h.icon = icon;
        h.label = label;
        h.freq = freq;
        saveHabits(habits);
        editingId = null;
        renderManage();
        render();
      });
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'cancel-btn';
      cancelBtn.textContent = '취소';
      cancelBtn.addEventListener('click', () => {
        editingId = null;
        renderManage();
      });
      row.appendChild(saveBtn);
      row.appendChild(cancelBtn);
    } else {
      row.innerHTML = `
        <div class="m-icon">${h.icon}</div>
        <div class="m-name">${h.label}${h.freq === 'weekly' ? '<span class="weeklytag">주 1회</span>' : ''}</div>
      `;
      const editBtn = document.createElement('button');
      editBtn.textContent = '✏️';
      editBtn.addEventListener('click', () => {
        editingId = h.id;
        renderManage();
      });
      const delBtn = document.createElement('button');
      delBtn.textContent = '🗑️';
      delBtn.addEventListener('click', () => {
        if (!confirm(`"${h.label}" 루틴을 삭제할까요?`)) return;
        habits = habits.filter(x => x.id !== h.id);
        saveHabits(habits);
        renderManage();
        render();
      });
      row.appendChild(editBtn);
      row.appendChild(delBtn);
    }

    list.appendChild(row);
  });
}

function addHabit() {
  const iconInput = document.getElementById('newIcon');
  const labelInput = document.getElementById('newLabel');
  const freqInput = document.getElementById('newFreq');
  const label = labelInput.value.trim();
  if (!label) { labelInput.focus(); return; }
  const icon = iconInput.value.trim() || '⭐';
  const freq = freqInput.value;

  habits.push({ id: makeId(), label, icon, freq });
  saveHabits(habits);

  iconInput.value = '';
  labelInput.value = '';
  freqInput.value = 'daily';

  renderManage();
  render();
}

document.getElementById('manageToggle').addEventListener('click', toggleManagePanel);
document.getElementById('addHabitBtn').addEventListener('click', addHabit);

render();
</script>
</body>
</html>

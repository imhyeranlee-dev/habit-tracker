<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="습관트래커">
<meta name="theme-color" content="#f5f3ee">
<title>매일 루틴 트래커</title>
<style>
  :root {
    --bg: #f5f3ee;
    --card: #ffffff;
    --text: #2b2b2b;
    --sub: #8a8a8a;
    --accent: #4a7c59;
    --accent-soft: #e4efe6;
    --border: #ececec;
    --danger: #c96a4f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    height: 100%;
  }
  body {
    display: flex;
    justify-content: center;
    padding: env(safe-area-inset-top, 24px) 16px calc(env(safe-area-inset-bottom, 24px) + 24px);
  }
  .app { width: 100%; max-width: 480px; }
  header { text-align: center; margin: 12px 0 20px; }
  header .date { font-size: 15px; color: var(--sub); margin-bottom: 4px; }
  header h1 { font-size: 22px; margin: 0; }
  .summary {
    background: var(--accent-soft);
    border-radius: 16px;
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }
  .summary .pct { font-size: 26px; font-weight: 700; color: var(--accent); }
  .summary .label { font-size: 13px; color: var(--sub); }
  .habit {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
    transition: transform .08s ease;
  }
  .habit:active { transform: scale(0.98); }
  .habit.done { border-color: var(--accent); background: var(--accent-soft); }
  .habit .icon { font-size: 24px; width: 32px; text-align: center; }
  .habit .info { flex: 1; }
  .habit .info .name { font-size: 16px; font-weight: 600; }
  .habit .info .streak { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .habit .check {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid #d8d8d8;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    color: transparent;
    flex-shrink: 0;
  }
  .habit.done .check {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .weeklytag {
    display: inline-block;
    font-size: 11px;
    color: var(--accent);
    background: #fff;
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 1px 6px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .history {
    margin-top: 24px;
  }
  .history h2 {
    font-size: 14px;
    color: var(--sub);
    font-weight: 600;
    margin: 0 0 8px 4px;
  }
  .history-row {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
  }
  .history-row .h-name {
    width: 90px;
    font-size: 12px;
    color: var(--sub);
    display: flex;
    align-items: center;
  }
  .dots { display: flex; gap: 4px; flex: 1; }
  .dot {
    flex: 1;
    aspect-ratio: 1;
    border-radius: 4px;
    background: #e9e9e9;
  }
  .dot.on { background: var(--accent); }
  footer {
    text-align: center;
    color: var(--sub);
    font-size: 11px;
    margin-top: 28px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="date" id="todayLabel"></div>
    <h1>오늘의 루틴</h1>
  </header>

  <div class="summary">
    <div>
      <div class="label">오늘 완료</div>
      <div class="pct" id="todayPct">0%</div>
    </div>
    <div>
      <div class="label" style="text-align:right">이번 주 완료</div>
      <div class="pct" id="weekPct" style="text-align:right">0%</div>
    </div>
  </div>

  <div id="habitList"></div>

  <div class="history">
    <h2>최근 14일</h2>
    <div id="historyGrid"></div>
  </div>

  <footer>탭해서 체크 · 데이터는 이 기기에만 저장됩니다</footer>
</div>

<script>
const HABITS = [
  { id: 'pullup',  label: '턱걸이 1분',      icon: '💪', freq: 'daily' },
  { id: 'water',   label: '물 500ml',       icon: '💧', freq: 'daily' },
  { id: 'english', label: '영어대화 10분',   icon: '🗣️', freq: 'daily' },
  { id: 'vitamin', label: '영양제',          icon: '💊', freq: 'daily' },
  { id: 'reading', label: '책 5P 읽기',      icon: '📖', freq: 'daily' },
  { id: 'writing', label: '글쓰기',          icon: '✍️', freq: 'weekly' },
];

const STORE_KEY = 'habitTrackerData_v1';

function loadData() {
  try {
    return JSON.parse(localStorage.getItem(STORE_KEY)) || { daily: {}, weekly: {} };
  } catch (e) {
    return { daily: {}, weekly: {} };
  }
}
function saveData(data) {
  localStorage.setItem(STORE_KEY, JSON.stringify(data));
}

function pad(n) { return n < 10 ? '0' + n : '' + n; }
function dateKey(d) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
// ISO week key, e.g. 2026-W28
function weekKey(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (date.getUTCDay() + 6) % 7;
  date.setUTCDate(date.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(date.getUTCFullYear(), 0, 4));
  const week = 1 + Math.round(((date - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay() + 6) % 7)) / 7);
  return `${date.getUTCFullYear()}-W${pad(week)}`;
}

let data = loadData();
const today = new Date();
const todayKey = dateKey(today);
const thisWeekKey = weekKey(today);

function isDone(habit) {
  if (habit.freq === 'daily') {
    return !!(data.daily[todayKey] && data.daily[todayKey][habit.id]);
  }
  return !!data.weekly[thisWeekKey + '_' + habit.id];
}

function toggle(habit) {
  if (habit.freq === 'daily') {
    if (!data.daily[todayKey]) data.daily[todayKey] = {};
    data.daily[todayKey][habit.id] = !data.daily[todayKey][habit.id];
  } else {
    const k = thisWeekKey + '_' + habit.id;
    data.weekly[k] = !data.weekly[k];
  }
  saveData(data);
  render();
}

function dailyStreak(habit) {
  let streak = 0;
  let d = new Date(today);
  // if today not yet done, start counting from yesterday
  if (!isDone(habit)) d.setDate(d.getDate() - 1);
  while (true) {
    const k = dateKey(d);
    if (data.daily[k] && data.daily[k][habit.id]) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else break;
  }
  return streak;
}

function weeklyStreak(habit) {
  let streak = 0;
  let d = new Date(today);
  if (!isDone(habit)) d.setDate(d.getDate() - 7);
  while (true) {
    const k = weekKey(d) + '_' + habit.id;
    if (data.weekly[k]) {
      streak++;
      d.setDate(d.getDate() - 7);
    } else break;
  }
  return streak;
}

function render() {
  document.getElementById('todayLabel').textContent =
    today.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' });

  const list = document.getElementById('habitList');
  list.innerHTML = '';
  let doneCount = 0;

  HABITS.forEach(habit => {
    const done = isDone(habit);
    if (done) doneCount++;
    const streak = habit.freq === 'daily' ? dailyStreak(habit) : weeklyStreak(habit);
    const streakLabel = habit.freq === 'daily'
      ? (streak > 0 ? `🔥 ${streak}일 연속` : '오늘부터 시작해봐요')
      : (streak > 0 ? `🔥 ${streak}주 연속` : '이번 주부터 시작해봐요');

    const row = document.createElement('div');
    row.className = 'habit' + (done ? ' done' : '');
    row.innerHTML = `
      <div class="icon">${habit.icon}</div>
      <div class="info">
        <div class="name">${habit.label}${habit.freq === 'weekly' ? '<span class="weeklytag">주 1회</span>' : ''}</div>
        <div class="streak">${streakLabel}</div>
      </div>
      <div class="check">✓</div>
    `;
    row.addEventListener('click', () => toggle(habit));
    list.appendChild(row);
  });

  document.getElementById('todayPct').textContent = Math.round((doneCount / HABITS.length) * 100) + '%';

  // week percent: average completion across last 7 days for daily habits + this week's weekly habit
  const dailyHabits = HABITS.filter(h => h.freq === 'daily');
  let weekTotal = 0, weekDone = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const k = dateKey(d);
    dailyHabits.forEach(h => {
      weekTotal++;
      if (data.daily[k] && data.daily[k][h.id]) weekDone++;
    });
  }
  HABITS.filter(h => h.freq === 'weekly').forEach(h => {
    weekTotal++;
    if (isDone(h)) weekDone++;
  });
  document.getElementById('weekPct').textContent = weekTotal ? Math.round((weekDone / weekTotal) * 100) + '%' : '0%';

  renderHistory();
}

function renderHistory() {
  const grid = document.getElementById('historyGrid');
  grid.innerHTML = '';
  HABITS.forEach(habit => {
    const row = document.createElement('div');
    row.className = 'history-row';
    const name = document.createElement('div');
    name.className = 'h-name';
    name.textContent = habit.icon + ' ' + habit.label;
    row.appendChild(name);
    const dots = document.createElement('div');
    dots.className = 'dots';
    for (let i = 13; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      const dot = document.createElement('div');
      let on;
      if (habit.freq === 'daily') {
        const k = dateKey(d);
        on = !!(data.daily[k] && data.daily[k][habit.id]);
      } else {
        on = !!data.weekly[weekKey(d) + '_' + habit.id];
      }
      dot.className = 'dot' + (on ? ' on' : '');
      dots.appendChild(dot);
    }
    row.appendChild(dots);
    grid.appendChild(row);
  });
}

render();
</script>
</body>
</html>
